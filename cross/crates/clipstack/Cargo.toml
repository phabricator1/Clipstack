[package]
name = "clipstack"
version = "0.1.0"
edition = "2021"
description = "A clipboard stack for your menubar / tray: every copy is pushed, one hotkey pops and pastes."
license = "MIT"

[[bin]]
name = "clipstack"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"

tao = "0.30"
tray-icon = "0.19"
global-hotkey = "0.6"
arboard = "3"
enigo = "0.2"
png = "0.17"

# Embeds assets/icon.ico into the .exe. Build-dependencies are resolved for the *host*,
# so this only kicks in when building on Windows (CI), not when cross-checking from a Mac.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"
core-foundation = "0.10"
