<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- ClipStack app icon: a clipboard with two more boards stacked behind it. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="clip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#D97706"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0F172A" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- macOS-style rounded square -->
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <!-- subtle highlight -->
  <ellipse cx="300" cy="180" rx="420" ry="260" fill="#FFFFFF" opacity="0.08"/>

  <!-- back boards (the stack) -->
  <g transform="translate(96,-88)">
    <rect x="272" y="268" width="424" height="560" rx="52" fill="#FFFFFF" opacity="0.22"/>
  </g>
  <g transform="translate(48,-44)">
    <rect x="272" y="268" width="424" height="560" rx="52" fill="#FFFFFF" opacity="0.45"/>
  </g>

  <!-- front clipboard -->
  <g filter="url(#shadow)">
    <rect x="272" y="268" width="424" height="560" rx="52" fill="url(#paper)"/>
  </g>
  <!-- clip -->
  <rect x="404" y="212" width="216" height="112" rx="40" fill="url(#clip)"/>
  <rect x="452" y="238" width="120" height="34" rx="17" fill="#FFFFFF" opacity="0.55"/>

  <!-- text lines -->
  <g fill="#64748B">
    <rect x="340" y="440" width="288" height="36" rx="18"/>
    <rect x="340" y="528" width="232" height="36" rx="18"/>
    <rect x="340" y="616" width="260" height="36" rx="18"/>
  </g>
  <!-- the "pop" arrow: last line becomes an arrow leaving the board -->
  <g fill="#4F46E5">
    <rect x="340" y="704" width="160" height="36" rx="18"/>
    <path d="M528 672 L596 722 L528 772 Z"/>
  </g>
</svg>
